<!-- Components start -->

<!-- START > figure.template-executive-profile (Default) -->
<!-- figure.template-executive-profile
  Variants:
    - Default:     no modifier attribute (light background)
    - Transparent: add data-variant="transparent"
    - Dark:        add data-variant="dark"
-->
<figure class="template-executive-profile">
  <!-- START > img (Profile Photo) -->
  <img
    src="https://template.webstandards.ca.gov/images/blockquote-with-image.jpg"
    alt="Portrait of Name, Official Title" />
  <!-- END > img (Profile Photo) -->

  <!-- START > div[data-role="executive-profile-body"] (Profile Details) -->
  <div data-role="executive-profile-body">
    <!-- Official title -->
    <p>Official Title</p>
    <!-- Name -->
    <h3 data-role="executive-name">Name</h3>
    <!-- Agency -->
    <p>Government agency</p>
    <!-- Bio / Contact link -->
    <p>
      <a href="javascript:;" aria-label="Link to Official's Website">
        Bio or contact info
      </a>
    </p>
  </div>
  <!-- END > div[data-role="executive-profile-body"] (Profile Details) -->
</figure>
<!-- END > figure.template-executive-profile (Default) -->
